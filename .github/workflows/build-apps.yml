name: Build desktop apps

on:
  workflow_dispatch:
  push:
    branches: [master]

jobs:
  build:
    name: Build ${{ matrix.artifact }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: kbparser-windows-x64
            archive: kbparser-windows-x64.zip
          - os: macos-14
            artifact: kbparser-macos-arm64
            archive: kbparser-macos-arm64.zip

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev,build]"

      - name: Run tests
        run: python -m pytest

      - name: Build apps
        run: python scripts/build_apps.py

      - name: Package apps on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          Compress-Archive -Path dist/apps/* -DestinationPath artifacts/${{ matrix.archive }} -Force

      - name: Package apps on macOS
        if: runner.os == 'macOS'
        run: |
          mkdir -p artifacts
          ditto -c -k --sequesterRsrc --keepParent dist/apps artifacts/${{ matrix.archive }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: artifacts/${{ matrix.archive }}
